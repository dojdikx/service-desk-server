services:
  postgres:
    image: postgres:15-alpine
    container_name: service-desk-db
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk_user
      POSTGRES_PASSWORD: servicedesk_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk_user -d servicedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
